<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Pro GH | Kenny Murray | Full Digital Agency - Accra</title>
<meta name="description" content="Kenny Murray - Excel Pro GH: Data Analytics, Website Developer, VA Assistant, Customer Support & Operations, Data Cleaning, Budget Tracker GHS, Inventory + Invoice. Accra, Ghana">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1931;--card:#142a4f;--gold:#f4c542;--text:#eef3ff;--muted:#9fb0d0}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.7}
a{color:var(--gold);text-decoration:none}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;max-width:1250px;margin:0 auto}
.logo{font-weight:800;color:var(--gold);font-size:1.6rem}
.nav-btn{background:var(--gold);color:#0a1931;padding:11px 24px;border-radius:30px;font-weight:800}
.hero{max-width:1250px;margin:0 auto;padding:42px 22px;display:grid;grid-template-columns:1.2fr .8fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(2rem,4.5vw,3.1rem);line-height:1.08;font-weight:800;margin:16px 0}
.hero h1 span{color:var(--gold)}
.hero p{color:var(--muted);font-size:1.06rem;margin-bottom:22px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn-primary{background:var(--gold);color:#0a1931;padding:14px 26px;border-radius:30px;font-weight:800;display:inline-block}
.btn-outline{border:2px solid #23406e;color:var(--text);padding:12px 26px;border-radius:30px;font-weight:600}
.stats{display:flex;gap:22px;margin-top:28px;border-top:1px solid #1c345c;padding-top:18px;flex-wrap:wrap}
.stat b{color:var(--gold);font-size:1.4rem;display:block}
.hero-img img{width:100%;height:520px;object-fit:cover;border-radius:24px;border:3px solid #23406e;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.badge{position:absolute;bottom:-14px;left:14px;background:#142a4f;border:1px solid #23406e;padding:10px 16px;border-radius:12px;font-size:.9rem}
section{padding:78px 22px}
.section-title{text-align:center;margin-bottom:44px}
.section-title h2{font-size:2.4rem}
.section-title p{color:var(--muted);max-width:700px;margin:10px auto 0}
.about-wrap{max-width:1250px;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:start}
.about-card{background:var(--card);border:1px solid #1e3a65;border-radius:20px;padding:30px}
.about-card h3{color:var(--gold);margin-bottom:12px;font-size:1.3rem}
.about-list{
